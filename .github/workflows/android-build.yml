name: Android Production APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-production:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build production release APK
        run: ./gradlew assembleProdRelease

      - name: Upload arm64-v8a production APK
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-release-arm64-v8a
          path: app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk