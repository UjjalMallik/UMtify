name: Android Production APK

# A push to main proves the release build still compiles and leaves the APK as
# a downloadable artifact on the run page. It never publishes: a GitHub Release
# is a decision, so it happens only on a manual run with that box ticked, or on
# a version tag someone pushed on purpose.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish to GitHub Releases?'
        required: true
        type: boolean
        default: true
      version_name:
        description: 'App Version Name (e.g. 1.0.6, 2.0.0)'
        required: true
        type: string
        default: '1.0.6'
      version_code:
        description: 'App Version Code (integer, e.g. 6, 7, 10)'
        required: true
        type: string
        default: '6'
      release_notes:
        description: 'Optional Release Notes / Changelog'
        required: false
        type: string
        default: ''

# Only the release step writes anything, and it needs to create the tag and the
# release itself.
permissions:
  contents: write

# One build at a time per ref, and never cancelled: a half-published release is
# worse than a queued one.
concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-production:
    # Pinned rather than `-latest`: GitHub announces every `-latest` migration
    # as a run annotation, and this image is the one the release is built on.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # One place decides what this run is: the version it builds, and whether
      # it publishes. Everything after this reads its outputs.
      #
      # A manual run uses exactly what was typed. A tag push takes its version
      # from the tag and publishes. A push to main takes the defaults from
      # app/build.gradle.kts (versionName "1.0.<run>", versionCode 100 + <run>)
      # and does not publish.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            name="$INPUT_VERSION_NAME"
            code="$INPUT_VERSION_CODE"
            release="$INPUT_CREATE_RELEASE"
          elif [ "$REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            code="$((100 + ${GITHUB_RUN_NUMBER}))"
            release="true"
          else
            name="1.0.${GITHUB_RUN_NUMBER}"
            code="$((100 + ${GITHUB_RUN_NUMBER}))"
            release="false"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "create_release=$release" >> "$GITHUB_OUTPUT"

      # A manual run or a tag compiles the APK with the version it is published
      # under, so the installed app reports the version on the release page. A
      # plain push builds the defaults.
      - name: Build production release APK
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ./gradlew assembleProdRelease \
              -PversionName="$INPUT_VERSION_NAME" \
              -PversionCode="$INPUT_VERSION_CODE"
          elif [ "$REF_TYPE" = "tag" ]; then
            ./gradlew assembleProdRelease \
              -PversionName="${GITHUB_REF_NAME#v}"
          else
            ./gradlew assembleProdRelease
          fi

      - name: Name the release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk \
            "release/UMtify-v${{ steps.version.outputs.name }}.apk"

      # Every run leaves its APK here, so a commit can be installed and tested
      # without a release existing for it.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: UMtify-v${{ steps.version.outputs.name }}
          path: release/UMtify-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14

      # Manual run with "Publish" ticked, or a v* tag push — nothing else. The
      # runner's pre-installed gh CLI does the publishing, so no third-party
      # action runs in this step. Empty release notes fall back to the notes
      # GitHub generates from the commits.
      - name: Publish GitHub Release
        if: steps.version.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.name }}
          TITLE: UMtify v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }})
          APK: release/UMtify-v${{ steps.version.outputs.name }}.apk
          NOTES: ${{ inputs.release_notes }}
        run: |
          # A re-run of a version that is already published replaces its APK
          # instead of failing on the duplicate tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            exit 0
          fi
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes
          fi
